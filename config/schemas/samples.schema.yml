$schema: "https://json-schema.org/draft/2020-12/schema"
description: an entry in the sample sheet
properties:
  sample:
    type: string
    description: sample name/identifier
  condition:
    type: string
    description: sample condition that will be compared during differential analysis
  replicate:
    type: number
    default: 1
    description: consecutive numbers representing multiple replicates of one condition
  read1:
    type: string
    description: names of fastq files, read 1
  read2:
    type: string
    description: names of fastq files, read 2 (optional)
  readumi:
    type: string
    description: names of fastq files, providing UMI (optional)

required:
  - sample
  - condition
  - replicate
  - read1

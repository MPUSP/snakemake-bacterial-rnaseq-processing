samplesheet: "config/samplesheet/samples_mpusp_custom.tsv"
libtype: "sense"

get_genome:
  database: "ncbi"
  assembly: "GCF_043231225.1"
  fasta: null
  gff: null
  gff_source_type:
    [
      "RefSeq": "gene",
      "RefSeq": "pseudogene",
      "RefSeq": "CDS",
      "Protein Homology": "CDS",
    ]

extract_features:
  biotypes: ["protein_coding", "pseudogene", "ncRNA", "rRNA", "tRNA"]

umi_extraction:
  method: "string"
  pattern: "--bc-pattern=NNNCCCNNNCCCNNNC"
umi_dedup: "--edit-distance-threshold=0"

fastp:
  extra: "-M 10 -l 18 --adapter_sequence TACACGACGCTCTTCCGATCT --adapter_sequence_r2 AGATCGGAAGAGCGTCGTGTA"

star:
  index: "--genomeSAindexNbases 9"
  extra:
    [
      "--outFilterMultimapNmax 10",
      "--outSAMmultNmax 1",
      "--outMultimapperOrder Random",
      "--alignIntronMax 1",
      "--alignEndsType EndToEnd",
    ]

samtools:
  sort: ""
  index: ""

feature_counts:
  defaults:
    [
      "-F GTF",
      "-t gene",
      "-g locus_tag",
      "-M",
      "--fracOverlap 0.2",
      "--largestOverlap",
    ]

deeptools:
  genome_size: 2000000
  extra: "--binSize 1 --normalizeUsing CPM --exactScaling --extendReads"

fastqc:
  extra: "--quiet --nogroup"

multiqc:
  config: "config/multiqc_config.yml"
  extra: "--dirs"
